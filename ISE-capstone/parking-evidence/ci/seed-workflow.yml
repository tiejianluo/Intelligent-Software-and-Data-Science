# Install at repository root: .github/workflows/ise-capstone.yml
# This is a ready-to-install template; it does not activate CI from this directory.
name: ISE capstone seed
on:
  push:
    paths:
      - 'ISE-capstone/**'
      - '.github/workflows/ise-capstone.yml'
  pull_request:
    paths:
      - 'ISE-capstone/**'
      - '.github/workflows/ise-capstone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ISE-capstone/parking-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-12
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1, resolved 2026-10-12
        with:
          ruby-version: '3.3.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-10-12
        with:
          python-version: '3.12.8'
      - name: Independent fee and timestamp checks
        run: ruby reference/test/fee_calculator_test.rb
      - name: Meaningful arithmetic mutation checks
        run: ruby reference/test/mutation_check.rb
      - name: Local documentation links
        run: python3 tools/check_links.py
